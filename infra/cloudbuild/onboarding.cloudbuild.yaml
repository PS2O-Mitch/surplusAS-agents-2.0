# Cloud Build pipeline for the Onboarding agent.
#
# Triggers on changes under `agents/onboarding/**`, `shared/**`, or
# `evals/golden/onboarding.jsonl`.
#
# Mirrors `pricing.cloudbuild.yaml` step-for-step except for the coverage
# gate (Onboarding's plan target is ≥ 90%, not 100%) and the typecheck
# scope. Final step deploys the agent via `scripts/deploy_agent.py`.

steps:
  - id: fetch-submodule
    # Pull the private vendor/surplusas-pricing submodule using a
    # fine-grained PAT, mirroring the .github/workflows/ci.yml recipe.
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    secretEnv: ['SUBMODULE_TOKEN']
    args:
      - -c
      - |
        set -euo pipefail
        git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

  - id: install
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv sync --frozen --extra dev

  - id: lint
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run ruff check .

  - id: typecheck
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run mypy agents/onboarding shared

  - id: unit-tests
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run pytest tests/unit/test_onboarding_tools.py \
          --cov=agents.onboarding.tools \
          --cov-fail-under=90 \
          -v

  - id: evals
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run python -m evals.runner --agent onboarding --threshold 0.85 --mode local

  - id: deploy
    name: ghcr.io/astral-sh/uv:0.5.5-python3.12-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        uv run python -m scripts.deploy_agent --name onboarding

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_STANDARD_2

# GitHub PAT for the private vendor submodule (see infra/terraform/cloudbuild_secrets.tf).
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-submodule-pat/versions/latest
      env: SUBMODULE_TOKEN

timeout: 1800s
