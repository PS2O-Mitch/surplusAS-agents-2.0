displayName: surplusas-dispute-triage-agent
description: Replays prior recommendations against fresh anchors; narrates pressure deltas.
agentFramework: ADK
model: gemini-2.5-pro
region: us-central1
serviceAccount: dispute-triage-agent-sa@ps2o-surplusas-api.iam.gserviceaccount.com
envFromSecretManager:
  - DB_PASSWORD
  - WEBHOOK_SIGNING_KEY
env:
  GOOGLE_GENAI_USE_VERTEXAI: "true"
  GOOGLE_CLOUD_PROJECT: ps2o-surplusas-api
  GOOGLE_CLOUD_LOCATION: us-central1
  CLOUD_SQL_INSTANCE: ps2o-surplusas-api:us-central1:surplusas-db
  DB_NAME: surplusas
  DB_USER: surplusas_agents_app
