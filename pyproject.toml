[project]
name = "surplusas-agents"
version = "0.1.0"
description = "SurplusAS multi-agent service: Concierge + Pricing + Onboarding + Listing Intake + Dispute Triage on Vertex AI Agent Engine."
requires-python = ">=3.12,<3.13"
authors = [{ name = "SurplusAS" }]
readme = "README.md"

dependencies = [
    "google-adk>=2.0.0b1",
    "google-genai>=0.5.0",
    "google-cloud-aiplatform>=1.71.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-auth>=2.35.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "cloud-sql-python-connector[asyncpg]>=1.18.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "argon2-cffi>=23.1.0",
    "surplusas-pricing",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
]

[tool.uv.sources]
surplusas-pricing = { path = "vendor/surplusas-pricing", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "shared", "service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["vendor/", "build/", "dist/"]
