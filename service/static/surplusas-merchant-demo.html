<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SurplusAS — Merchant Demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF8;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --text2: #6B6B6B;
  --text3: #9C9C9C;
  --accent: #1B6B3A;
  --accent-light: #E8F5EC;
  --accent-glow: #2ECC71;
  --border: #E8E8E4;
  --danger: #D94040;
  --danger-light: #FDE8E8;
  --amber: #D4870B;
  --amber-light: #FEF5E1;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: #1A1A1A;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.phone-frame {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 0 0 3px #333, 0 0 0 6px #1A1A1A, 0 20px 60px rgba(0,0,0,0.5);
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 34px;
  background: #1A1A1A;
  border-radius: 0 0 20px 20px;
  z-index: 100;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 28px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  height: 50px;
  position: relative;
  z-index: 50;
}

.status-bar-right {
  display: flex;
  gap: 6px;
  align-items: center;
}

.screen {
  height: calc(100% - 50px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 100px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.screen::-webkit-scrollbar { display: none; }

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0 20px;
}

.header h1 {
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
}

.header p {
  font-size: 14px;
  color: var(--text2);
  margin-top: 4px;
}

.try-it-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  background: var(--accent-light);
  color: var(--accent);
  border: 1.5px solid var(--accent);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s;
}

.try-it-btn:active { transform: scale(0.98); }
.try-it-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.sample-status {
  font-size: 12px;
  color: var(--text2);
  margin-top: 6px;
  min-height: 16px;
}

.upload-zone {
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.upload-zone:active { transform: scale(0.98); }
.upload-zone.has-image { border-style: solid; border-color: var(--accent); padding: 0; }
.upload-zone.dragover { border-color: var(--accent); background: var(--accent-light); }

.upload-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 12px;
  background: var(--accent-light);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.upload-icon svg { width: 24px; height: 24px; color: var(--accent); }

.upload-zone h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.upload-zone p { font-size: 13px; color: var(--text3); }

.preview-img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 14px;
  display: none;
}

.upload-zone.has-image .preview-img { display: block; }
.upload-zone.has-image .upload-icon,
.upload-zone.has-image h3,
.upload-zone.has-image p { display: none; }

.input-group {
  margin-top: 16px;
}

.input-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  display: block;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.text-input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--card);
  resize: none;
  transition: border-color 0.2s;
  outline: none;
}

.text-input:focus { border-color: var(--accent); }
.text-input::placeholder { color: var(--text3); }

.generate-btn {
  width: 100%;
  padding: 16px;
  background: var(--accent);
  color: white;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-top: 16px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.generate-btn:active { transform: scale(0.98); }
.generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.generate-btn .spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}

.generate-btn.loading .btn-text { display: none; }
.generate-btn.loading .spinner { display: block; }

@keyframes spin { to { transform: rotate(360deg); } }

.result-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-top: 20px;
  overflow: hidden;
  display: none;
  animation: slideUp 0.4s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-card.visible { display: block; }

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
}

.result-header h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.status-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.status-badge.ready { background: var(--accent-light); color: var(--accent); }
.status-badge.review { background: var(--amber-light); color: var(--amber); }
.status-badge.blocked { background: var(--danger-light); color: var(--danger); }

.result-body { padding: 18px; }

/* Editable listing fields — read as listing text until hovered/focused. */
.edit-field {
  width: 100%;
  font-family: inherit;
  color: var(--text);
  background: transparent;
  border: 1.5px dashed transparent;
  border-radius: 8px;
  padding: 4px 6px;
  margin-left: -6px;
  transition: border-color 0.15s, background 0.15s;
  outline: none;
}

.edit-field:hover { border-color: var(--border); }
.edit-field:focus { border-color: var(--accent); background: var(--card); }

.edit-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 6px;
}

.edit-desc {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
  resize: none;
  margin-bottom: 14px;
}

.meta-item .edit-field {
  font-size: 13px;
  font-weight: 500;
  padding: 2px 4px;
  margin-left: -4px;
}

select.edit-field { appearance: none; cursor: pointer; }

.price-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}

.price-surplus {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent);
}

.price-original {
  font-size: 16px;
  color: var(--text3);
  text-decoration: line-through;
}

.discount-tag {
  font-size: 12px;
  font-weight: 700;
  color: white;
  background: var(--accent);
  padding: 3px 8px;
  border-radius: 6px;
}

.pressure-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}

.pressure-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--accent-light);
  color: var(--accent);
}

.audit-line {
  font-size: 11px;
  color: var(--text3);
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  margin-bottom: 6px;
}

.price-note {
  font-size: 11.5px;
  color: var(--text3);
  margin-bottom: 16px;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.meta-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 12px;
}

.meta-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}

.agent-notes {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  margin-top: 4px;
  font-size: 12.5px;
  color: var(--text2);
  line-height: 1.5;
  white-space: pre-wrap;
}

.error-card {
  background: var(--danger-light);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 20px;
  display: none;
  animation: slideUp 0.4s ease;
}

.error-card.visible { display: block; }
.error-card h3 { font-size: 15px; font-weight: 600; color: var(--danger); margin-bottom: 6px; }
.error-card p { font-size: 13px; color: #8B2020; line-height: 1.5; }

.clarification-box { background: #EEF2FF; border: 1px solid #A5B4FC; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 16px; }
.clarification-box h4 { font-size: 12px; font-weight: 700; color: #4338CA; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.clarification-box p { font-size: 13px; color: #3730A3; line-height: 1.5; }

.listing-id-chip { display: inline-block; font-size: 11px; font-weight: 600; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; margin-bottom: 12px; font-family: monospace; }

.home-bar {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 140px;
  height: 5px;
  background: #CCC;
  border-radius: 3px;
}

.publish-section {
  padding: 16px 18px 18px;
  border-top: 1px solid var(--border);
}

.publish-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent-glow);
  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.publish-btn:active { transform: scale(0.98); }
.publish-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.publish-btn .spinner {
  display: none;
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}

.publish-btn.loading .btn-text { display: none; }
.publish-btn.loading .spinner { display: block; }

.publish-status {
  margin-top: 10px;
  padding: 0 2px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--text2);
  min-height: 0;
  word-break: break-word;
}

.publish-status.success {
  background: var(--accent-light);
  color: var(--accent);
  padding: 10px 12px;
  border-radius: 8px;
}

.publish-status.error {
  background: var(--danger-light);
  color: var(--danger);
  padding: 10px 12px;
  border-radius: 8px;
}

.publish-status.pending {
  background: var(--bg);
  color: var(--text2);
  padding: 10px 12px;
  border-radius: 8px;
}

.dispute-section {
  padding: 16px 18px 18px;
}
.dispute-divider {
  height: 1px;
  background: var(--border);
  margin-bottom: 14px;
}
.dispute-heading {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}
.dispute-hint {
  font-size: 12.5px;
  color: var(--text2);
  line-height: 1.45;
  margin-bottom: 12px;
}
.dispute-input {
  margin-bottom: 10px;
}
.dispute-btn {
  background: var(--amber);
}
.dispute-status {
  margin-top: 10px;
  font-size: 13px;
  color: var(--text2);
  min-height: 0;
}
.dispute-status.pending {
  background: var(--bg);
  color: var(--text2);
  padding: 10px 12px;
  border-radius: 8px;
}
.dispute-status.error {
  background: var(--danger-light);
  color: var(--danger);
  padding: 10px 12px;
  border-radius: 8px;
}
.dispute-result {
  margin-top: 14px;
}
.dispute-result.visible {
  background: var(--amber-light);
  border: 1px solid var(--amber);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}
.dispute-result h5 {
  font-size: 13px;
  font-weight: 700;
  color: var(--amber);
  margin-bottom: 6px;
}
.dispute-result .narration {
  font-size: 13.5px;
  color: var(--text);
  line-height: 1.5;
  white-space: pre-wrap;
}
.dispute-result .tool-calls {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--text3);
  font-family: ui-monospace, 'SF Mono', Consolas, monospace;
  word-break: break-all;
}
.dispute-result .webhook-note {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--amber);
  font-size: 11.5px;
  color: var(--text2);
}
</style>
</head>
<body>
<div class="phone-frame">
  <div class="notch"></div>
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-bar-right">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 8h2v4H1zM5 5h2v7H5zM9 3h2v9H9zM13 0h2v12h-2z" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 24 12" fill="none"><rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="3" width="14" height="6" rx="1" fill="currentColor"/><rect x="21" y="4" width="2" height="4" rx="0.5" fill="currentColor"/></svg>
    </div>
  </div>

  <div class="screen" id="screen">
    <div class="header">
      <div>
        <h1>SurplusAS Demo</h1>
        <p>Merchant listing</p>
      </div>
      <button class="try-it-btn" id="tryItBtn" type="button" aria-label="Try with sample food image">
        <span aria-hidden="true">✨</span>
        <span>Try It</span>
      </button>
    </div>

    <div id="upload-section">
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M20 16v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2"/></svg>
        </div>
        <h3>Tap to photograph food</h3>
        <p>or upload an existing photo</p>
        <img class="preview-img" id="previewImg" alt="">
      </div>
      <div class="sample-status" id="sampleStatus" aria-live="polite"></div>
      <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    </div>

    <div class="input-group">
      <label for="merchantInput">Merchant note</label>
      <textarea class="text-input" id="merchantInput" rows="3" placeholder="e.g. Closing in 30 mins, 20 croissants left. Retail $3.50 each"></textarea>
    </div>

    <button class="generate-btn" id="generateBtn">
      <span class="btn-text">Generate listing</span>
      <div class="spinner"></div>
    </button>

    <div class="error-card" id="errorCard">
      <h3 id="errorTitle">Error</h3>
      <p id="errorMsg"></p>
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-header">
        <h3>Review listing</h3>
        <span class="status-badge" id="statusBadge"></span>
      </div>
      <div class="result-body" id="resultBody"></div>
      <div class="publish-section" id="publishSection" style="display:none">
        <button class="publish-btn" id="publishBtn">
          <span class="btn-text">Publish Listing</span>
          <div class="spinner"></div>
        </button>
        <div class="publish-status" id="publishStatus"></div>
      </div>
      <div class="dispute-section" id="disputeSection" style="display:none">
        <div class="dispute-divider"></div>
        <h4 class="dispute-heading">Later that day — dispute the price</h4>
        <p class="dispute-hint">Tap to see Beat 2: the deterministic pricing engine replays with current anchors and shows you exactly which pressures changed.</p>
        <textarea class="text-input dispute-input" id="disputeInput" rows="2" placeholder="e.g. Customer complained the price is too high for this neighborhood"></textarea>
        <button class="publish-btn dispute-btn" id="disputeBtn">
          <span class="btn-text">Open dispute</span>
          <div class="spinner"></div>
        </button>
        <div class="dispute-status" id="disputeStatus"></div>
        <div class="dispute-result" id="disputeResult"></div>
      </div>
    </div>
  </div>

  <div class="home-bar"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let imageBase64 = null;  // client-side visual context only; never sent to the backend
let current = null;      // last ok envelope from /generate or /publish

// The nine categories seeded in pricing_coefficients / reference_prices.
const CATEGORIES = ['prepared_meal','bakery','beverage','deli','produce',
                    'dairy','packaged_goods','frozen','mixed_bag'];

const publishedListingId = () =>
  current && current.status === 'ok' && current.listing.status === 'published'
    ? current.listing.listing_id : null;

// Served from /static the page is same-origin with the API; opened straight
// from disk (file://) it talks to the local dev server instead (CORS is open
// on the demo surface — service/app.py).
const IS_FILE = location.protocol === 'file:';
const API_URL = IS_FILE ? 'http://localhost:8080' : '';
const STATIC_BASE = IS_FILE ? 'http://localhost:8080/static/' : '';

// Image upload
$('#uploadZone').addEventListener('click', () => $('#fileInput').click());

$('#fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    imageBase64 = ev.target.result;
    $('#previewImg').src = imageBase64;
    $('#uploadZone').classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

// Drag and drop
const zone = $('#uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    imageBase64 = ev.target.result;
    $('#previewImg').src = imageBase64;
    zone.classList.add('has-image');
  };
  reader.readAsDataURL(file);
});

function resetOutput() {
  current = null;
  $('#resultCard').classList.remove('visible');
  $('#errorCard').classList.remove('visible');
  $('#publishSection').style.display = 'none';
  $('#publishStatus').textContent = '';
  $('#publishStatus').className = 'publish-status';
  $('#disputeSection').style.display = 'none';
  $('#disputeStatus').textContent = '';
  $('#disputeStatus').className = 'dispute-status';
  $('#disputeResult').classList.remove('visible');
  $('#disputeResult').innerHTML = '';
  $('#disputeInput').value = '';
}

// Generate — merchant note -> Listing Intake -> reviewable draft
$('#generateBtn').addEventListener('click', async () => {
  const btn = $('#generateBtn');
  const note = $('#merchantInput').value.trim();

  if (!note) {
    $('#merchantInput').focus();
    return;
  }

  btn.classList.add('loading');
  btn.disabled = true;
  resetOutput();

  try {
    console.log('[SurplusAS] generate payload:', JSON.stringify({ note }));
    const res = await fetch(`${API_URL}/demo/v1/listings/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ note }),
    });

    const json = await res.json();
    console.log('[SurplusAS] generate response (HTTP ' + res.status + '):', JSON.stringify(json, null, 2));

    if (!res.ok) {
      showError('API Error ' + res.status, json.detail || 'Request failed');
      return;
    }
    if (json.error) {
      showError('Generate failed', json.error);
      return;
    }
    if (json.status === 'error') {
      showError('Generate failed', json.error || 'The listing could not be read back.');
      return;
    }

    current = json.status === 'ok' ? json : null;
    renderCard(json);

  } catch (err) {
    showError('Connection failed', `Could not reach the SurplusAS API at ${API_URL || location.origin}. Is the local server running? Start it with: uv run python -m service.main`);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

// Publish — send the reviewed (possibly edited) fields; the agent re-validates
// and the engine re-prices them, then persists a published row.
$('#publishBtn').addEventListener('click', async () => {
  if (!current || current.status !== 'ok') return;

  const draft = readDraftFromCard();
  const statusEl = $('#publishStatus');
  const setStatus = (cls, text) => {
    statusEl.className = 'publish-status ' + cls;
    statusEl.textContent = text;
  };

  const problem = validateDraft(draft);
  if (problem) {
    setStatus('error', problem.msg);
    if (problem.el) problem.el.focus();
    return;
  }

  if (!confirm('Publish this listing to customers?')) return;

  const btn = $('#publishBtn');
  btn.classList.add('loading');
  btn.disabled = true;
  setStatus('pending', 'Re-pricing and publishing...');

  try {
    const res = await fetch(`${API_URL}/demo/v1/listings/publish`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listing: draft }),
    });
    const r = await res.json();
    console.log('[SurplusAS] publish response:', JSON.stringify(r, null, 2));

    if (!res.ok || r.error) {
      setStatus('error', `Publish failed: ${r.error || r.detail || 'Unknown error'}`);
      return;
    }

    if (r.status === 'ok') {
      current = r;
      renderCard(r);
      // Trust only the DB read-back, never the model's word for it.
      if (r.listing.status === 'published') {
        setStatus('success', `Published! ID: ${r.listing.listing_id}`);
        $('#disputeSection').style.display = 'block';
      } else {
        setStatus('pending', `Saved as ${r.listing.status} — publish was not honored; try again.`);
      }
    } else if (r.status === 'clarification') {
      // Keep the edits on screen; surface what the agent asked for.
      setStatus('error', r.narration || 'The agent needs more information.');
    } else {
      setStatus('error', r.error || 'Publish failed.');
    }
  } catch (err) {
    setStatus('error', `Publish error: ${err.message}`);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

// Beat 2 — open a dispute on the published listing
$('#disputeBtn').addEventListener('click', async () => {
  const lid = publishedListingId();
  if (!lid) return;
  const reasonEl = $('#disputeInput');
  const reason = (reasonEl.value || '').trim();
  if (!reason) {
    reasonEl.focus();
    return;
  }

  const btn = $('#disputeBtn');
  const statusEl = $('#disputeStatus');
  const resultEl = $('#disputeResult');

  const setStatus = (cls, text) => {
    statusEl.className = 'dispute-status ' + cls;
    statusEl.textContent = text;
  };

  btn.classList.add('loading');
  btn.disabled = true;
  resultEl.classList.remove('visible');
  resultEl.innerHTML = '';
  setStatus('pending', 'Replaying recommendation with current anchors...');

  try {
    const res = await fetch(
      `${API_URL}/demo/v1/listings/${encodeURIComponent(lid)}/dispute`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason }),
      },
    );
    const r = await res.json();
    console.log('[SurplusAS] dispute response:', JSON.stringify(r, null, 2));

    if (!res.ok || r.error) {
      setStatus('error', `Dispute failed: ${r.error || r.detail || 'Unknown error'}`);
      return;
    }

    setStatus('', '');
    const tools = Array.isArray(r.tool_calls) ? r.tool_calls.map(t => t.name).filter(Boolean) : [];
    const replayUsed = tools.includes('replay_recommendation');
    const webhookFired = tools.includes('emit_price_update_webhook');

    let html = '<h5>Dispute Triage</h5>';
    html += `<div class="narration">${esc(r.narration || '(no narration)')}</div>`;
    if (tools.length > 0) {
      html += `<div class="tool-calls">tool path: ${tools.map(esc).join(' → ')}</div>`;
    }
    html += `<div class="webhook-note">${
      webhookFired
        ? '🔔 price.updated webhook fired (delta &gt; $0.25)'
        : (replayUsed
            ? 'Replay produced no material price change — no webhook'
            : 'No replay tool called this turn')
    }</div>`;
    resultEl.innerHTML = html;
    resultEl.classList.add('visible');
  } catch (err) {
    setStatus('error', `Dispute error: ${err.message}`);
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

function showError(title, msg) {
  $('#errorTitle').textContent = title;
  $('#errorMsg').textContent = msg;
  $('#errorCard').classList.add('visible');
  $('#errorCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// The review card — renders the constructed listing with editable fields.
// The DOM inputs ARE the edit state; readDraftFromCard() collects them.
function renderCard(resp) {
  const card = $('#resultCard');
  const body = $('#resultBody');
  const badge = $('#statusBadge');
  const narration = resp.narration || '';

  let html = '';
  let badgeText = '';
  let badgeClass = '';

  if (resp.status === 'ok') {
    const l = resp.listing;
    const p = resp.pricing || {};
    const noPrice = l.status === 'draft_no_price';

    if (l.status === 'published') { badgeText = 'Published'; badgeClass = 'ready'; }
    else if (noPrice) { badgeText = 'Needs price'; badgeClass = 'blocked'; }
    else { badgeText = 'Draft — review & publish'; badgeClass = 'review'; }

    html += `<div class="listing-id-chip">ID: ${esc(l.listing_id)}</div>`;
    html += `<input id="fTitle" class="edit-field edit-title" value="${esc(l.title || '')}" aria-label="Listing title">`;
    html += `<textarea id="fDesc" class="edit-field edit-desc" rows="2" aria-label="Description" placeholder="Add a description…">${esc(l.description || '')}</textarea>`;

    if (!noPrice && p.recommended_price != null) {
      const pct = Math.round(Number(p.recommended_discount_pct || 0) * 100);
      html += `<div class="price-row">
        <span class="price-surplus">$${Number(p.recommended_price).toFixed(2)}</span>
        <span class="price-original">$${Number(l.retail_value).toFixed(2)}</span>
        ${pct ? `<span class="discount-tag">${pct}% off</span>` : ''}
      </div>`;
      const chips = Object.entries(p.applied_pressures || {})
        .filter(([, v]) => typeof v === 'number')
        .map(([k, v]) => `<span class="pressure-chip">${esc(k.replace(/_pressure$/, ''))} ${v >= 0 ? '+' : ''}${Number(v).toFixed(2)}</span>`)
        .join('');
      if (chips) html += `<div class="pressure-chips">${chips}</div>`;
      html += `<div class="audit-line">formula ${esc(p.formula_version || '?')} · rec ${esc(String(p.recommendation_id || '').slice(0, 8))}</div>`;
      html += `<div class="price-note">Set by the pricing engine — editing retail or expiry re-prices on publish.</div>`;
    }

    html += `<div class="meta-grid">
      <div class="meta-item"><div class="meta-label">Category</div>${categorySelect(l.category)}</div>
      <div class="meta-item"><div class="meta-label">Quantity</div><input id="fUnits" class="edit-field" type="number" min="1" step="1" value="${esc(String(l.units ?? ''))}" aria-label="Quantity"></div>
      <div class="meta-item"><div class="meta-label">Retail value $</div><input id="fRetail" class="edit-field" type="number" min="0.01" step="0.01" value="${esc(String(l.retail_value ?? ''))}" aria-label="Retail value"></div>
      <div class="meta-item"><div class="meta-label">Hours to expiry</div><input id="fHours" class="edit-field" type="number" min="0" step="0.5" value="${esc(String(l.hours_until_expiry ?? ''))}" aria-label="Hours until expiry"></div>
    </div>`;

    html += `<div class="agent-notes">${esc(narration || 'Listing saved.')}</div>`;
  } else {
    // clarification — the agent asked a question; nothing was persisted.
    badgeText = 'Needs info';
    badgeClass = 'review';
    html += `<div class="clarification-box"><h4>The agent needs more detail</h4><p>${esc(narration || 'Add more detail to your note.')}</p></div>`;
    html += `<div class="agent-notes">Add the missing details to your note above and Generate again.</div>`;
  }

  badge.textContent = badgeText;
  badge.className = 'status-badge' + (badgeClass ? ' ' + badgeClass : '');
  body.innerHTML = html;

  const canPublish = resp.status === 'ok' && resp.listing.status !== 'published';
  $('#publishSection').style.display = resp.status === 'ok' ? 'block' : 'none';
  $('#publishBtn').style.display = canPublish ? 'block' : 'none';

  card.classList.add('visible');
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
}

function categorySelect(currentCat) {
  const cat = currentCat || CATEGORIES[0];
  const options = (CATEGORIES.includes(cat) ? CATEGORIES : [cat, ...CATEGORIES])
    .map(c => `<option value="${esc(c)}"${c === cat ? ' selected' : ''}>${esc(c)}</option>`)
    .join('');
  return `<select id="fCategory" class="edit-field" aria-label="Category">${options}</select>`;
}

function readDraftFromCard() {
  return {
    title: $('#fTitle').value.trim(),
    description: $('#fDesc').value.trim(),
    category: $('#fCategory').value,
    units: parseInt($('#fUnits').value, 10),
    retail_value: parseFloat($('#fRetail').value),
    hours_until_expiry: parseFloat($('#fHours').value),
  };
}

// Mirrors the agent's validate_listing checks — saves an LLM round-trip.
function validateDraft(d) {
  if (!d.title) return { msg: 'Title is required.', el: $('#fTitle') };
  if (!d.category) return { msg: 'Pick a category.', el: $('#fCategory') };
  if (!Number.isInteger(d.units) || d.units < 1) return { msg: 'Quantity must be a whole number of 1 or more.', el: $('#fUnits') };
  if (!(d.retail_value > 0)) return { msg: 'Retail value must be greater than 0.', el: $('#fRetail') };
  if (!(d.hours_until_expiry >= 0)) return { msg: 'Hours to expiry must be 0 or more.', el: $('#fHours') };
  return null;
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

// Try It — load curated sample image + merchant note, shuffle-bag rotation
// (each of N samples appears exactly once per N clicks; order randomized per cycle)
let samplesManifest = null;
let sampleBag = [];
let lastSampleId = null;

async function loadSamplesManifest() {
  if (samplesManifest) return samplesManifest;
  // Relative to the page's /static/ base — same origin as the mount in service/app.py.
  const res = await fetch(STATIC_BASE + 'samples/manifest.json');
  if (!res.ok) throw new Error('manifest ' + res.status);
  const json = await res.json();
  samplesManifest = json.samples || [];
  return samplesManifest;
}

function drawSample(samples) {
  if (sampleBag.length === 0) {
    sampleBag = samples.slice();
    for (let i = sampleBag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [sampleBag[i], sampleBag[j]] = [sampleBag[j], sampleBag[i]];
    }
    if (lastSampleId && sampleBag[0].id === lastSampleId && sampleBag.length > 1) {
      [sampleBag[0], sampleBag[1]] = [sampleBag[1], sampleBag[0]];
    }
  }
  const sample = sampleBag.shift();
  lastSampleId = sample.id;
  return sample;
}

$('#tryItBtn').addEventListener('click', async () => {
  const btn = $('#tryItBtn');
  btn.disabled = true;
  try {
    const samples = await loadSamplesManifest();
    if (samples.length === 0) return;
    const sample = drawSample(samples);

    resetOutput();
    $('#fileInput').value = '';

    const imgRes = await fetch(STATIC_BASE + sample.image);
    if (!imgRes.ok) throw new Error('sample ' + imgRes.status);
    const blob = await imgRes.blob();

    await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = ev => {
        imageBase64 = ev.target.result;
        const preview = $('#previewImg');
        preview.src = imageBase64;
        preview.alt = `Sample: ${sample.category} surplus`;
        $('#uploadZone').classList.add('has-image');
        $('#merchantInput').value = sample.note;
        $('#sampleStatus').textContent = `Sample: ${sample.category}`;
        resolve();
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(blob);
    });
  } catch (err) {
    showError('Could not load sample', err.message || 'Please try again.');
  } finally {
    btn.disabled = false;
  }
});
</script>
