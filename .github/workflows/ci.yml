name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule clone disabled until a cross-repo PAT (or deploy key)
          # is provisioned for the private vendor/surplusas-pricing repo.
          # Week 1 smoke tests don't need pricing_engine; Week 2 (engine_adapter)
          # will require fixing this — track in OPEN_ITEMS.
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy agents shared service

      - name: Pytest (unit)
        run: uv run pytest tests/unit -v
