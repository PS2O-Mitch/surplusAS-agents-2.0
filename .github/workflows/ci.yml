name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Main repo uses the default GITHUB_TOKEN. The private vendor
        # submodule is fetched in the next step with a scoped PAT so
        # this token doesn't need cross-repo read.

      - name: Fetch vendor/surplusas-pricing submodule
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy agents shared service

      - name: Pytest (unit)
        run: uv run pytest tests/unit -v

      - name: Pricing eval (local)
        run: uv run python -m evals.runner --agent pricing --threshold 0.85 --mode local

      - name: Onboarding eval (local)
        run: uv run python -m evals.runner --agent onboarding --threshold 0.85 --mode local

      - name: Listing Intake eval (local)
        run: uv run python -m evals.runner --agent listing_intake --threshold 0.85 --mode local

      - name: Concierge eval (local)
        run: uv run python -m evals.runner --agent concierge --threshold 0.85 --mode local
